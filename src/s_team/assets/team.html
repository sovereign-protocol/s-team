      const held = document.createElement('div');
      held.className = 'role-holders';
      const heading = document.createElement('div');
      heading.className = 'role-holders-heading';
      const title = document.createElement('h5');
      title.textContent = 'Held by';
      heading.append(title);
      held.append(heading);

      if (['held', 'contested'].includes(trusteeship.state)) {
        const person = (payloadState.participants || []).find(
          entry => entry.uuid === trusteeship.holder_actor_uuid,
        ) || {};
        const badges = document.createElement('div');
        badges.className = 'holder-badges';
        const badge = SovereignUI.entityBadge({
          kind: 'person',
          person,
          label: trusteeship.is_self ? 'You' : trusteeship.holder_name,
          status: 'accepted',
          self: Boolean(trusteeship.is_self),
          className: 'holder-badge',
        });
        badge.querySelector('.ui-entity-label').classList.add('holder-name');
        badge.title = `${trusteeship.is_self ? 'You' : trusteeship.holder_name} — `
          + `holds ${label}`;
        // Stepping out is the holder's own act, so the mark is on their own
        // badge - the same place, and the same ×, as withdrawing an offer.
        if (interactive && trusteeship.is_self) {
          const leave = document.createElement('button');
          leave.type = 'button';
          leave.className = 'holder-action ui-entity-action';
          leave.textContent = '×';
          leave.title = `Step out of ${label}`;
          leave.onclick = event => {
            event.stopPropagation();
            document.querySelector('#confirmModalConfirmBtn').textContent =
              'Step out';
            confirmAction(
              `Step out of ${label}?`,
              'The trusteeship stays vacant until a valid decision is implemented.',
              async () => {
                try {
                  const context = await requestDecisionContext(
                    `Step out of ${label}`,
                  );
                  if (!context) return;
                  await api('/api/team/trusteeships/resign', {
                    team_uuid: current.uuid, trust,
                    ...context,
                  });
                  await load();
                  showToast(`You no longer hold ${label}`);
                } catch (error) { showToast(error.message, true); }
              },
            );
          };
          badge.append(leave);
        }
        badges.append(badge);
        held.append(badges);
      } else {
        const none = document.createElement('p');
        none.className = 'role-unheld';
        none.textContent = trusteeship.state === 'contested'
          ? 'Concurrent successors are contested; the incumbent remains.'
          : trusteeship.state === 'unconfigured'
            ? 'Not instantiated'
            : 'Vacant — a decision is required';
        held.append(none);
      }
      if (trusteeship.state === 'vacant') {
        const candidacies = document.createElement('div');
        candidacies.className = 'trustee-candidacies';
        const candidacyTitle = document.createElement('h6');
        candidacyTitle.textContent = 'Acting candidates';
        candidacies.append(candidacyTitle);
        for (const candidate of trusteeship.candidates || []) {
          const row = document.createElement('div');
          row.className = 'trustee-candidate';
          row.append(avatarFor(candidate));
          const name = document.createElement('span');
          name.className = 'trustee-candidate-name';
          name.textContent = candidate.is_self ? 'You' : candidate.name;
          row.append(name);
          if (interactive && candidate.can_withdraw) {
            const withdraw = document.createElement('button');
            withdraw.type = 'button';
            withdraw.textContent = 'Withdraw';
            withdraw.onclick = async () => {
              try {
                await api('/api/team/trusteeships/candidacy/withdraw', {
                  team_uuid: current.uuid,
                  candidacy_uuid: candidate.uuid,
                });
                await load();
              } catch (error) { showToast(error.message, true); }
            };
            row.append(withdraw);
          }
          candidacies.append(row);
        }
        if (!(trusteeship.candidates || []).length) {
          const empty = document.createElement('p');
          empty.textContent = 'No current Member is acting in this domain.';
          candidacies.append(empty);
        }
        if (interactive && trusteeship.can_enter_candidacy) {
          const enter = document.createElement('button');
          enter.type = 'button';
          enter.textContent = `Act for ${label}`;
          enter.onclick = async () => {
            try {
              await api('/api/team/trusteeships/candidacy/enter', {
                team_uuid: current.uuid, trust,
              });
              await load();
            } catch (error) { showToast(error.message, true); }
          };
          candidacies.append(enter);
        }
        held.append(candidacies);
      }
      card.append(held);
      return card;
    };

    // Roles are content, not administration. They render inside the document
    // rather than in a side panel, because a role is part of what people
    // accept - but as cards rather than prose, because they are structured.
    const renderRoles = (team, interactive) => {
      const section = document.createElement('div');
      section.className = 'roles';
      const explanation = document.createElement('p');
      explanation.className = 'section-intro';
      explanation.textContent =
        'What this team expects, and who has been invited to it.';
      section.append(explanation);
      section.append(renderTrusteeRoleCard('identity', interactive));
      section.append(renderTrusteeRoleCard('trust', interactive));

      const roles = displayedChildren(team, 'team_role');
      const rolesHaveProposals = roles.some(entry => entry.proposed);
      roles.forEach(({node: role, proposed}, index) => {
        section.append(renderRoleCard({
          role,
          proposed,
          index,
          count: roles.length,
          interactive: interactive && !proposed,
          // A proposed role is not ours to edit, but answering the proposal
          // is the whole point of showing it.
          reactable: interactive,
          movable: interactive && !proposed && !rolesHaveProposals,
        }));
      });
      if (!roles.length) {
        const empty = document.createElement('p');
        empty.className = 'roles-empty';
        // Identity is above this, and is a role, so "no roles" would be
        // contradicted by the card directly over it.
        empty.textContent = 'No other roles yet.';
        section.append(empty);
      }
      if (interactive) {
        section.append(SovereignUI.addComposer({
          noun: 'role',
          placeholder: 'Role name',
          onSubmit: async name => {
            await api('/api/team/roles/create',
              {team_uuid: team.uuid, name});
            await load();
          },
          onError: error => showToast(error.message, true),
        }));
      }
      return section;
    };

    // The document is rebuilt wholesale on every poll. That stays - it is
    // cheap at this size and needs no second render path - but an unchanged
    // payload should cost nothing. Recorded only once the document is
    // actually rebuilt, so a render skipped by the edit guard below is
    // retried on the next poll instead of being lost.
    let renderedPayloadJson = '';

    const renderPool = (payload, encoded) => {
      payloadState = payload;
      current = null;
      currentPool = payload.pool;
      currentInteractionAllowed = true;
      document.querySelector('.organization-header h2').textContent = 'Pool access';
      const tree = document.querySelector('#organizationTree');
      tree.replaceChildren();
      for (const pool of payload.pools || []) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'organization-name pool-navigation-item';
        button.textContent = `${pool.team_title || 'Team'} Pool`;
        button.onclick = () => openPool(pool.uuid);
        tree.append(button);
      }
      SovereignShell.setTopicSelector({
        label: 'Pool',
        topics: (payload.pools || []).map(pool => ({
          uuid: pool.uuid,
          title: `${pool.team_title || 'Team'} Pool`,
        })),
        selectedUuid: currentPool?.uuid || '',
        onSelect: openPool,
      });
      document.querySelector('#empty').hidden = true;
      const article = document.querySelector('#document');
      if (article.contains(document.activeElement)
          && document.activeElement.matches('input, textarea, select')) {
        SovereignShell.refresh();
        return;
      }
      renderedPayloadJson = encoded;
      article.replaceChildren();
      article.classList.remove('is-readonly');

      const heading = document.createElement('div');
      heading.className = 'pool-heading';
      const title = document.createElement('h2');
      title.textContent = `${currentPool.team_title || 'Team'} onboarding Pool`;
      heading.append(title);
      if (currentPool.linked_team_present) {
        const back = document.createElement('button');
        back.type = 'button';
        back.textContent = 'Open Team';
        back.onclick = () => selectTeam(currentPool.team_uuid);
        heading.append(back);
      }
      article.append(heading);
      const intro = document.createElement('p');
      intro.className = 'pool-intro';
      intro.textContent = 'This is a separate onboarding channel. Team content is not published here.';
      article.append(intro);

      if (currentPool.can_publish) {
        const form = document.createElement('form');
        form.className = 'pool-publish-form';
        const label = document.createElement('strong');
        label.textContent = 'Publish invitation';
        const opening = document.createElement('select');
        opening.required = true;
        for (const item of currentPool.publishable_openings || []) {
          const option = document.createElement('option');
          option.value = item.uuid;
          option.textContent = `Member opening · ${item.opened_at || 'open'}`;
          opening.append(option);
        }
        const expiry = document.createElement('input');
        expiry.type = 'datetime-local';
        const defaultExpiry = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
        expiry.value = defaultExpiry.toISOString().slice(0, 16);
        const publish = document.createElement('button');
        publish.type = 'submit';
        publish.textContent = 'Publish';
        publish.disabled = !opening.options.length;
        form.append(label, opening, expiry, publish);
        if (!opening.options.length) {
          const note = document.createElement('small');
          note.textContent = 'Open Member applications in the Team first.';
          form.append(note);
        }
        form.onsubmit = async event => {
          event.preventDefault();
          try {
            await api('/api/team/pool/invitations/publish', {
              team_uuid: currentPool.team_uuid,
              opening_uuid: opening.value,
              expires_at: new Date(expiry.value).toISOString(),
            });
            await load();
          } catch (error) { showToast(error.message, true); }
        };
        article.append(form);
      }

      const activeTitle = document.createElement('h3');
      activeTitle.textContent = 'Active invitations';
      article.append(activeTitle);
      if (!(currentPool.active_invitations || []).length) {
        const empty = document.createElement('p');
        empty.className = 'pool-empty';
        empty.textContent = 'No active invitation is published.';
        article.append(empty);
      }
      for (const invitation of currentPool.active_invitations || []) {
        const card = document.createElement('section');
        card.className = 'pool-invitation-card';
        const head = document.createElement('div');
        head.className = 'pool-card-heading';
        const name = document.createElement('strong');
        name.textContent = invitation.team_title;
        const expiry = document.createElement('span');
        expiry.textContent = `Expires ${new Date(invitation.expires_at).toLocaleString()}`;
        head.append(name, expiry);
        card.append(head);
        if (invitation.can_apply) {
          const apply = document.createElement('button');
          apply.type = 'button';
          apply.textContent = 'Apply to join';
          apply.onclick = async () => {
            try {
              await api('/api/team/pool/applications/submit', {
                pool_uuid: currentPool.uuid,
                invitation_uuid: invitation.uuid,
              });
              await load();
            } catch (error) { showToast(error.message, true); }
          };
          card.append(apply);
        }
        for (const application of invitation.applications || []) {
          const row = document.createElement('div');
          row.className = 'pool-application';
          row.append(avatarFor({
            uuid: application.actor_uuid,
            name: application.actor_name,
            picture: application.picture,
            is_self: application.is_self,
          }));
          const applicant = document.createElement('strong');
          applicant.textContent = application.is_self ? 'You' : application.actor_name;
          const state = document.createElement('span');
          state.className = 'pool-application-state';
          state.textContent = application.resolution === 'pending'
            ? application.state : application.resolution;
          row.append(applicant, state);
          const actions = document.createElement('span');
          actions.className = 'pool-application-actions';
          if (application.can_withdraw) {
            const withdraw = document.createElement('button');
            withdraw.type = 'button';
            withdraw.textContent = 'Withdraw';
            withdraw.onclick = async () => {
              try {
                await api('/api/team/pool/applications/withdraw', {
                  pool_uuid: currentPool.uuid,
                  application_uuid: application.uuid,
                });
                await load();
              } catch (error) { showToast(error.message, true); }
            };
            actions.append(withdraw);
          }
          if (application.can_resolve) {
            for (const [outcome, text] of [['accepted', 'Accept'], ['rejected', 'Reject']]) {
              const decide = document.createElement('button');
              decide.type = 'button';
              decide.textContent = text;
              decide.onclick = async () => {
                try {
                  const context = await requestDecisionContext(`${text} Pool application`);
                  if (!context) return;
                  await api('/api/team/pool/applications/resolve', {
                    pool_uuid: currentPool.uuid,
                    application_uuid: application.uuid,
                    outcome,
                    ...context,
                  });
                  await load();
                } catch (error) { showToast(error.message, true); }
              };
              actions.append(decide);
            }
          }
          if (application.can_mount) {
            const mount = document.createElement('button');
            mount.type = 'button';
            mount.textContent = 'Join Team channel';
            mount.onclick = async () => {
              try {
                await api('/api/team/pool/team/mount', {
                  pool_uuid: currentPool.uuid,
                  application_uuid: application.uuid,
                });
                showToast('Team channel connected');
                await load();
              } catch (error) { showToast(error.message, true); }
            };
            actions.append(mount);
          }
          row.append(actions);
          card.append(row);
        }
        article.append(card);
      }

      const expired = (currentPool.history || []).filter(item => item.expired);
      if (expired.length) {
        const history = document.createElement('details');
        history.className = 'pool-history';
        const summary = document.createElement('summary');
        summary.textContent = `History (${expired.length})`;
        history.append(summary);
        for (const invitation of expired) {
          const line = document.createElement('p');
          line.textContent = `${invitation.team_title} · expired ${new Date(invitation.expires_at).toLocaleString()}`;
          history.append(line);
        }
        article.append(history);
      }
      SovereignShell.refresh();
    };

    const render = (payload) => {
      const encoded = JSON.stringify(payload);
      if (encoded === renderedPayloadJson) { SovereignShell.refresh(); return; }
      if (payload.view === 'pool') {
        renderPool(payload, encoded);
        return;
      }
      payloadState = payload;
      current = payload.team;
      currentPool = null;
      currentInteractionAllowed = Boolean(payload.interaction?.allowed);
      document.querySelector('.organization-header h2').textContent = 'Organization';
      renderOrganization(payload.organization);
      SovereignShell.setTopicSelector({
        label: payload.is_organization ? 'Organization' : 'Team',
        topics: payload.teams.map(item => ({
          uuid: item.uuid,
          title: item.data.title || 'Untitled team',
        })),
        selectedUuid: current?.uuid || '',
        onSelect: selectTeam,
        onRename: current && currentInteractionAllowed ? async title => {
          await api('/api/team/teams/rename',
            {team_uuid: current.uuid, title});
          await load();
        } : null,
      });
      document.querySelector('#empty').hidden = Boolean(current);
      // Beside the topic name when a team is open, and in the empty state
      // when none is - the same act, wherever you are when you want it.

      const article = document.querySelector('#document');
      // Never rebuild the document while it is being edited, or the caret
      // is destroyed mid-word by the poll.
      if (article.contains(document.activeElement)
        && (
          document.activeElement.isContentEditable
          || document.activeElement.matches('input, textarea, select')
        )) {
        SovereignShell.refresh();
        return;
      }
      renderedPayloadJson = encoded;
      article.replaceChildren();
      article.classList.toggle('is-readonly', !currentInteractionAllowed);
      if (!current) { SovereignShell.refresh(); return; }

      if (!ephemeral.disclosures
          || ephemeral.disclosures.agreementUuid !== current.uuid) {
        // Who is here, first and open. The agreement is the longest thing on
        // the page and the least often changed, so it arrives closed - the
        // team is people and roles, and the text is what they hold to.
        ephemeral.disclosures = {
          agreementUuid: current.uuid,
          actors: true,
          roles: false,
          document: false,
        };
      }
      const disclosure = (title, key) => SovereignUI.disclosure(title, {
        expanded: ephemeral.disclosures[key],
        onToggle: open => { ephemeral.disclosures[key] = open; },
      });

      // The team's own name, above everything and inside nothing. It used to
      // sit under the "Agreement" heading, which made one name serve two
      // things: renaming the body silently retitled the document its members
      // had accepted. The lamp and the reaction belong here too - this row is
      // the team node, and the agreement's title is a field on it, so a second
      // row would report the same divergence twice.
      article.append(elementRow({
        node: current,
        tag: 'h2',
        field: 'title',
        rename: value => api('/api/team/teams/rename',
          {team_uuid: current.uuid, title: value}),
        interactive: currentInteractionAllowed,
        reactable: currentInteractionAllowed,
      }));

      // Archiving is this client putting a team away, and nothing more:
      // it is not a decision about the team, so it is not gated on holding
      // anything and it asks nobody. Everybody else keeps their copy.
      const archive = document.createElement('button');
      archive.type = 'button';
      archive.className = 'archive-team';
      archive.textContent = 'Archive';
      archive.title =
        'Save this team as a file here and take it off this client. '
        + 'Nothing is sent; everybody else keeps their copy and their access.';
      archive.onclick = () => {
        document.querySelector('#confirmModalConfirmBtn').textContent =
          'Archive';
        confirmAction(
          `Archive ${current.data.title || 'this team'}?`,
          'It is written to a file on this client and removed from here. '
          + 'Nothing is sent: everybody else keeps their copy and their '
          + 'access. Restoring it brings it back private - the file carries '
          + 'no channel.',
          async () => {
            try {
              const done = await api('/api/team/teams/archive',
                {team_uuid: current.uuid});
              await load();
              showToast(`Archived to ${done?.value || 'a file'}`);
            } catch (error) { showToast(error.message, true); }
          },
        );
      };
      article.append(archive);
      if (!currentInteractionAllowed) {
        const notice = document.createElement('p');
        notice.className = 'readonly-notice';
        notice.textContent = (
          payload.interaction?.reason
          || 'This subteam is visible but read-only.'
        );
        article.append(notice);
      }

      const documentPart = disclosure('Agreement', 'document');
      const content = document.createElement('div');
      content.className = 'content';
      // The agreement's own name, drawn the way a role's purpose is: an
      // editable heading rather than a row of its own, because the status it
      // would carry is already on the team name above. An unnamed agreement
      // stays genuinely empty - the prompt is a pseudo-element, so it can
      // never be committed as the name.
      const agreementHead = document.createElement('div');
      agreementHead.className = 'agreement-head';
      const agreementTitle = document.createElement('h2');
      agreementTitle.className = 'agreement-title';
      agreementTitle.textContent = current.data.agreement_title || '';
      if (currentInteractionAllowed) {
        editable(agreementTitle, current.data.agreement_title || '', value =>
          api('/api/team/agreement/rename',
            {team_uuid: current.uuid, title: value}));
      }
      agreementHead.append(agreementTitle);
      if (currentInteractionAllowed) {
        agreementHead.append(SovereignUI.addComposer({
          noun: 'section',
          placeholder: 'Section title',
          onSubmit: async title => {
            await api('/api/team/sections/create',
              {team_uuid: current.uuid, title});
            await load();
          },
          onError: error => showToast(error.message, true),
        }));
      }
      documentPart.content.append(agreementHead);
      const sections = displayedChildren(current, 'team_section');
      const sectionsHaveProposals = sections.some(entry => entry.proposed);
      sections.forEach(({node: section, proposed}, sIndex) => {
        const block = document.createElement('section');
        block.append(elementRow({
          node: section,
          tag: 'h3',
          field: 'title',
          proposed,
          interactive: currentInteractionAllowed,
          reactable: currentInteractionAllowed,
          rename: proposed ? null : value => api(
            '/api/team/sections/rename',
            {section_uuid: section.uuid, title: value},
          ),
          addControl: !proposed && currentInteractionAllowed
            ? SovereignUI.addComposer({
              noun: 'clause',
              placeholder: 'Clause text',
              className: 'element-add-control',
              onSubmit: async text => {
                await api('/api/team/clauses/create',
                  {section_uuid: section.uuid, text});
                await load();
              },
              onError: error => showToast(error.message, true),
            })
            : null,
          onDelete: proposed ? null : async () => {
            try {
              await api('/api/team/sections/delete', {section_uuid: section.uuid});
              await load();
            } catch (error) { showToast(error.message, true); }
          },
          deleteTitle: 'Delete this section?',
          deleteMessage: 'Its clauses are deleted with it. This cannot be undone.',
          index: sIndex,
          count: sections.length,
          onMove: proposed || sectionsHaveProposals ? null : async newIndex => {
            try {
              await api('/api/team/sections/move',
                {section_uuid: section.uuid, index: newIndex});
              await load();
            } catch (error) { showToast(error.message, true); }
          },
        }));

        const clauses = displayedChildren(
          section, 'team_clause', proposed,
        );
        const clausesHaveProposals = clauses.some(entry => entry.proposed);
        clauses.forEach(({
          node: clause, proposed: clauseProposed, inherited: clauseInherited,
        }, cIndex) => {
          block.append(elementRow({
            node: clause,
            tag: 'p',
            field: 'text',
            proposed: clauseProposed,
            interactive: currentInteractionAllowed,
            reactable: currentInteractionAllowed && !clauseInherited,
            rename: clauseProposed ? null : value => api(
              '/api/team/clauses/update',
              {clause_uuid: clause.uuid, text: value},
            ),
            onDelete: clauseProposed ? null : async () => {
              try {
                await api('/api/team/clauses/delete', {clause_uuid: clause.uuid});
                await load();
              } catch (error) { showToast(error.message, true); }
            },
            deleteTitle: 'Delete this clause?',
            deleteMessage: 'This cannot be undone.',
            index: cIndex,
            count: clauses.length,
            onMove: clauseProposed || clausesHaveProposals ? null : async newIndex => {
              try {
                await api('/api/team/clauses/move',
                  {clause_uuid: clause.uuid, index: newIndex});
                await load();
              } catch (error) { showToast(error.message, true); }
            },
          }));
        });
        content.append(block);
      });
      documentPart.content.append(content);

      const actorsPart = disclosure('Actors', 'actors');
      actorsPart.content.append(renderParticipants(
        payload.participants, payload.trusteeships, currentInteractionAllowed,
      ));
      actorsPart.content.append(renderMembership(
        payload.membership || {openings: []}, currentInteractionAllowed,
      ));
      actorsPart.content.append(renderTrusteeElections(
        payload.trustee_elections || [],
        payload.membership || {is_member: false},
        currentInteractionAllowed,
      ));
      actorsPart.content.append(renderDecisionTrail(
        payload.decision_trail || [], currentInteractionAllowed,
      ));
      // Identity normally reads as a badge on whoever holds it, so the line
      // only appears separately when it needs attention.
      const identityState = payload.identity || {state: 'vacant'};
      if (!(identityState.state === 'held'
            && identityState.is_self
            && !(identityState.claims || []).length)) {
        actorsPart.content.append(
          renderIdentity(identityState, currentInteractionAllowed),
        );
      }

      const rolesPart = disclosure('Roles', 'roles');
      rolesPart.content.append(renderRoles(current, currentInteractionAllowed));
      // Who is here, then what is expected of them, then the text they hold
      // to. The agreement used to come first; it is the longest section and
      // the least often changed, and leading with it buried the team.
      article.append(actorsPart.section, rolesPart.section, documentPart.section);
      SovereignShell.refresh();
    };

    // The header is sticky, and the Organization tree sticks below it, so
    // the tree needs to know how tall it is. The shell decides what the
    // header holds - and grows it when a pane, a selector or an alarm
    // appears - so this is measured rather than assumed, on every render as
    // well as on resize: the shell fills the header in over several frames,
    // and a single observation catches whichever one it lands on.
    const header = document.querySelector('header');
    const publishHeaderHeight = () => {
      document.documentElement.style.setProperty(
        '--header-height',
        `${Math.round(header.getBoundingClientRect().height)}px`,
      );
    };
    new ResizeObserver(publishHeaderHeight).observe(header);

    const load = async () => {
      const poolUuid = new URLSearchParams(window.location.search).get('pool');
      const path = poolUuid
        ? `/api/team/document?pool_uuid=${encodeURIComponent(poolUuid)}`
        : '/api/team/document';
      render(await api(path));
      publishHeaderHeight();
    };

    SovereignShell.mount({
      container: document.querySelector('#shell'),
      applicationId: 'team',
      topicUuid: () => (
        currentInteractionAllowed
          ? (currentPool?.uuid || current?.uuid || '')
          : ''
      ),
      state: () => payloadState,
      onChanged: () => load(),
      agendaRoutes: {
        topicKey: 'team_uuid',
        create: '/api/team/agenda/create',
        delete: '/api/team/agenda/delete',
        setPriority: '/api/team/agenda/set_priority',
        move: '/api/team/agenda/move',
      },
      // Name a node so the disagreement pane can say which clause or section
      // is unsettled, rather than showing a bare uuid.
      describeNode: (uuid) => {
        const node = findDisplayedNode(uuid);
        return node
          ? (node.data.title || node.data.text || '').slice(0, 60)
          : '';
      },
      // The pane lists what is unsettled; these settle it without leaving it,
      // so a team with a dozen proposals is worked through top to bottom.
      canReact: () => currentInteractionAllowed,
      reactNode: (uuid, choice) => applyReaction(uuid, choice),
    });

    // Deep link from the overview: /apps/team?team=<uuid> selects
    // that team on arrival, mirroring Kanban's ?board=<uuid>.
    async function selectTeamFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const uuid = params.get('team');
      if (!uuid) return;
      try {
        await api('/api/team/teams/select', {team_uuid: uuid});
      } catch (error) { showToast(error.message, true); }
      params.delete('team');
      const query = params.toString();
      window.history.replaceState({}, '', window.location.pathname + (query ? `?${query}` : ''));
    }

    publishHeaderHeight();
    selectTeamFromUrl().then(load);
    setInterval(load, 3000);
  </script>
</body>
</html>
