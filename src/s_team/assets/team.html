<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S-Team</title>
  <link rel="stylesheet" href="/shared.css">
  <link rel="stylesheet" href="/apps/team/styles.css">
</head>
<body>
  <div id="toast" class="toast"></div>
  <header>
    <div id="shell"></div>
  </header>
  <main>
    <aside id="organization" aria-label="Organization">
      <div class="organization-header">
        <h2>Organization</h2>
        <button type="button" id="newTeamBtn"
                class="ui-button ui-button-small">+ Add organization</button>
      </div>
      <div id="organizationTree"></div>
      <p class="consent-note">
        Joining a parent does not join its subteams; it makes them
        available. You have to be a member of every parent first.
      </p>
    </aside>
    <div class="document-pane">
      <div id="empty">
        <p>Create an organization to begin, or accept an invitation to a team.</p>
      </div>
      <article id="document"></article>
    </div>
  </main>
  <!-- shared.js binds the confirm dialog's buttons as it loads, so the
       dialog markup has to exist before that script runs. -->
  <dialog id="confirmModal">
    <form method="dialog">
      <h2 id="confirmModalTitle"></h2>
      <p id="confirmModalMessage"></p>
      <menu>
        <button type="button" id="confirmModalCancelBtn">Cancel</button>
        <button type="button" id="confirmModalConfirmBtn" class="danger">Delete</button>
      </menu>
    </form>
  </dialog>
  <dialog id="newTeamModal">
    <form method="dialog" id="newTeamForm">
      <h2>New Organization</h2>
      <label>Name<input id="newTeamName" value="Untitled organization"></label>
      <label>Copy from (optional)<select id="newTeamTemplate"></select></label>
      <menu>
        <button type="button" id="cancelNewTeamBtn">Cancel</button>
        <button type="submit" class="primary">Create</button>
      </menu>
    </form>
  </dialog>
  <dialog id="decisionContextModal">
    <form method="dialog" id="decisionContextForm">
      <h2 id="decisionContextTitle">Decision context</h2>
      <label>Signals
        <textarea id="decisionSignals" rows="2"
          placeholder="What called for this decision?"></textarea>
      </label>
      <label>Consideration
        <textarea id="decisionConsideration" rows="2"
          placeholder="What did you take into account?"></textarea>
      </label>
      <label>Expectation
        <textarea id="decisionExpectation" rows="2"
          placeholder="What do you expect to happen?"></textarea>
      </label>
      <p class="decision-context-note">Signals may be left empty, but the decision will be marked.</p>
      <menu>
        <button type="button" id="decisionContextCancel">Cancel</button>
        <button type="submit" class="primary">Continue</button>
      </menu>
    </form>
  </dialog>
  <script src="/shared-api.js"></script>
  <script src="/shared.js"></script>
  <script>
    const api = SovereignApi.request;
    let current = null;
    let currentPool = null;
    let currentInteractionAllowed = false;
    let payloadState = {};
    const nodeStatus = (payload, uuid) => payload.transition_by_node[uuid]?.type;

    const requestDecisionContext = title => new Promise(resolve => {
      const dialog = document.querySelector('#decisionContextModal');
      const form = document.querySelector('#decisionContextForm');
      form.reset();
      document.querySelector('#decisionContextTitle').textContent = title;
      const finish = value => {
        if (dialog.open) dialog.close();
        resolve(value);
      };
      form.onsubmit = event => {
        event.preventDefault();
        finish({
          signals: document.querySelector('#decisionSignals').value.trim(),
          consideration: document.querySelector('#decisionConsideration').value.trim(),
          expectation: document.querySelector('#decisionExpectation').value.trim(),
        });
      };
      document.querySelector('#decisionContextCancel').onclick = () => finish(null);
      dialog.oncancel = event => {
        event.preventDefault();
        finish(null);
      };
      dialog.showModal();
    });

    // Core's transition sentences ask the page who a peer is, and fall back
    // to the raw address when the page cannot say - which is how the
    // divergence pane came to name people "relay:cb7aed85-...". Both
    // answers come out of known_identities, the one place every application
    // can resolve an address or an authoring uuid to somebody's name.
    function peerLabel(address) {
      const text = String(address || '');
      const known = (payloadState.known_identities || []).find(
        entry => (entry.addresses || [entry.address]).includes(text),
      );
      if (known?.name) return known.name;
      const port = text.match(/:(\d+)\/?$/);
      return port ? port[1] : text.replace(/^https?:\/\//, '') || 'a peer';
    }

    function userForParticipant(uuid) {
      return (payloadState.known_identities || []).find(
        entry => entry.uuid === uuid,
      ) || {uuid, name: '?', picture: ''};
    }

    // One route for both directions: the choice already carries which act it
    // is and whose absence it settles, so this does not have to work out
    // again which side holds the stale revision.
    const applyReaction = async (nodeUuid, choice) => {
      try {
        await api('/api/team/react', {
          node_uuid: nodeUuid,
          source_addr: choice.peerAddr,
          reaction: choice.action,
          absent: choice.absent,
        });
        await load();
        showToast(choice.action === 'rollback' ? 'Taken back' : 'Adopted');
      } catch (error) { showToast(error.message, true); }
    };

    // Editing happens in place. An element becomes contenteditable on click,
    // commits on blur or Enter, and reverts on Escape, so there is no modal
    // between a reader and the text they are reading.
    const editable = (element, original, commit) => {
      element.classList.add('editable');
      element.tabIndex = 0;
      const begin = () => {
        if (element.isContentEditable) return;
        element.contentEditable = 'true';
        element.focus();
        const range = document.createRange();
        range.selectNodeContents(element);
        const selection = getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      };
      element.onclick = begin;
      element.onkeydown = (event) => {
        // Not editing yet: Enter or Space begins editing.
        if (!element.isContentEditable) {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            begin();
          }
          return;
        }
        // Editing: plain Enter commits; Shift+Enter inserts a line break
        // (the browser's default for a contenteditable), so clauses can hold
        // more than one line. Escape reverts.
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          element.blur();
        } else if (event.key === 'Escape') {
          element.textContent = original;
          element.contentEditable = 'false';
          element.blur();
        }
      };
      element.onblur = async () => {
        element.contentEditable = 'false';
        // innerText, not textContent: it turns the line breaks a contenteditable
        // inserts (as <br>/<div>) back into "\n", which textContent drops.
        const value = element.innerText.replace(/\n+$/, '').trim();
        if (!value || value === original) { element.textContent = original; return; }
        try {
          await commit(value);
          await load();
        } catch (error) {
          element.textContent = original;
          showToast(error.message, true);
        }
      };
      return element;
    };

    // One row shape for every level of the document:
    //   left   [status] name/text
    //   right  [add subelement]  and, on hover, [react] [delete]
    // React is deliberately not hover-only. Delete is destructive and rare,
    // so hiding it is right; reacting is the only way out of a divergence,
    // and an exit you cannot see is not an exit. It appears whenever there
    // is something to react to and stays hidden otherwise.
    //
    // Reacting is deliberately NOT governed by `interactive`, which asks
    // whether this row may be edited. A proposed element is not editable -
    // it is not ours to change until we accept it - but answering the
    // proposal is precisely what the row is there for. Folding the two
    // together is what left the receiving side looking at "Proposed" with
    // no way to accept it, while the proposer had a button to take it back.
    const elementRow = ({node, tag, field, rename, addControl, onDelete,
                         deleteTitle, deleteMessage, index, count, onMove,
                         toggle, proposed = false, interactive = true,
                         reactable = true}) => {
      const row = document.createElement('div');
      row.className = 'element-row';
      row.classList.toggle('is-proposed', proposed);
      const transition = payloadState.transition_by_node?.[node.uuid];
      const status = transition?.stage === 'in_flight'
        ? 'in_flight'
        : (transition?.type && transition.type !== 'in_agreement'
          ? transition.type : 'in_agreement');
      row.dataset.status = status;

      const lamp = document.createElement('span');
      lamp.className = 'status-lamp';
      lamp.dataset.status = status;
      lamp.title = transition ? transitionLabel(transition) : 'In agreement';
      lamp.setAttribute('aria-label', lamp.title);

      const label = document.createElement(tag);
      label.className = 'element-label';
      label.textContent = node.data[field];
      if (rename && !proposed && interactive) {
        editable(label, node.data[field], rename);
      }

      const actions = document.createElement('span');
      actions.className = 'element-actions';
      if (proposed) {
        const badge = document.createElement('span');
        badge.className = 'proposal-badge';
        badge.textContent = 'Proposed';
        actions.append(badge);
      }

      // Reorder among siblings. Up/down rather than drag: unambiguous, works
      // by keyboard, and does not fight the click-to-edit on the text itself.
      if (interactive && onMove) {
        const up = document.createElement('button');
        up.type = 'button';
        up.className = 'element-move';
        up.textContent = '↑';
        up.title = 'Move up';
        up.disabled = index === 0;
        up.onclick = () => onMove(index - 1);
        const down = document.createElement('button');
        down.type = 'button';
        down.className = 'element-move';
        down.textContent = '↓';
        down.title = 'Move down';
        down.disabled = index === count - 1;
        down.onclick = () => onMove(index + 1);
        actions.append(up, down);
      }

      if (interactive && addControl) actions.append(addControl);

      // Core draws the control and words it: one available act reads as a
      // button naming it, several become a menu. The wording is the same
      // sentence both ends already see on the status lamp, so a team's
      // proposals read exactly like a board's.
      const reaction = reactable ? SovereignUI.reactionControl({
        info: transition,
        className: 'element-react',
        onReact: choice => applyReaction(node.uuid, choice),
      }) : null;
      if (reaction) actions.append(reaction);

      if (interactive && onDelete) {
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'element-delete';
        remove.textContent = 'Delete';
        remove.title = 'Delete';
        remove.onclick = () => {
          document.querySelector('#confirmModalConfirmBtn').textContent = 'Delete';
          confirmAction(deleteTitle, deleteMessage, onDelete);
        };
        actions.append(remove);
      }

      // A caret right after the name, and nothing else: what it hides is
      // directly below it, so a word saying so would only repeat the page.
      // It shares the label's grid cell rather than taking one of its own,
      // which would put every other row's actions in a different column.
      let heading = label;
      if (toggle) {
        heading = document.createElement('span');
        heading.className = 'element-heading';
        const caret = document.createElement('button');
        caret.type = 'button';
        caret.className = 'element-toggle';
        const draw = open => {
          caret.textContent = open ? '▾' : '▸';
          caret.title = open ? 'Hide the text' : 'Show the text';
          caret.setAttribute('aria-expanded', String(open));
        };
        draw(toggle.expanded);
        caret.onclick = () => {
          const open = caret.getAttribute('aria-expanded') !== 'true';
          draw(open);
          toggle.onToggle(open);
        };
        heading.append(label, caret);
      }

      row.append(lamp, heading, actions);
      return row;
    };

    // Live children in display order. Mirrors Session._ordered_children: an
    // explicit "order" wins, otherwise the node keeps its position in the
    // payload (which is creation order), so items pre-dating ordering still
    // sort sensibly.
    const ordered = (children) => (children || [])
      .filter(node => !node.deleted)
      .map((node, position) => [node, node.data.order ?? position])
      .sort((a, b) => a[1] - b[1])
      .map(pair => pair[0]);

    const proposedChildren = (parentUuid) => (payloadState.proposed_nodes || [])
      .map(entry => entry.node)
      .filter(node => !node.deleted && node.parent_uuid === parentUuid);

    // `inherited` says the row is only shown as a proposal because its parent
    // is one. That distinction decides who gets a reaction: accepting a
    // proposed role brings its accountabilities with it, so answering each of
    // them separately would be four buttons for one decision. A proposal made
    // directly against something we already have is its own decision.
    const displayedChildren = (parent, nodeType, inheritedProposal = false) => {
      const entries = ordered(parent.children)
        .filter(node => node.data.type === nodeType)
        .map(node => ({
          node, proposed: inheritedProposal, inherited: inheritedProposal,
        }));
      if (!inheritedProposal) {
        const present = new Set(entries.map(entry => entry.node.uuid));
        for (const node of proposedChildren(parent.uuid)) {
          if (node.data.type === nodeType && !present.has(node.uuid)) {
            entries.push({node, proposed: true, inherited: false});
          }
        }
      }
      return entries
        .map((entry, position) => [
          entry, entry.node.data.order ?? position,
        ])
        .sort((a, b) => a[1] - b[1])
        .map(pair => pair[0]);
    };

    const selectTeam = async (teamUuid) => {
      const url = new URL(window.location.href);
      url.searchParams.delete('pool');
      window.history.replaceState({}, '', url);
      await api('/api/team/teams/select', {team_uuid: teamUuid});
      await load();
    };

    const openPool = async poolUuid => {
      const url = new URL(window.location.href);
      url.searchParams.set('pool', poolUuid);
      url.searchParams.delete('team');
      window.history.pushState({}, '', url);
      await load();
    };

    // A root team has to be creatable from the page that shows organizations. The empty
    // state named the two ways in - create one, or accept an invitation -
    // and offered neither, so a client with no team had no way to get one.
    //
    // It lives with the Organization, because that is the list it adds to,
    // and it is the same modal the Cockpit uses, because it is the same
    // act: a name, and optionally a team to copy - which is how a template
    // gets used (2.8). Being a dialog rather than an inline field also puts
    // it outside the polled rebuild entirely. A root Team is presented as an
    // Organization; storage and API vocabulary remain Team.
    const openNewTeamModal = () => {
      document.querySelector('#newTeamName').value = 'Untitled organization';
      const template = document.querySelector('#newTeamTemplate');
      template.replaceChildren();
      const blank = document.createElement('option');
      blank.value = '';
      blank.textContent = 'Start empty';
      template.append(blank);
      for (const item of payloadState.teams || []) {
        const option = document.createElement('option');
        option.value = item.uuid;
        option.textContent = item.data.title || 'Untitled team';
        template.append(option);
      }
      document.querySelector('#newTeamModal').showModal();
    };

    document.querySelector('#newTeamBtn').onclick = openNewTeamModal;
    document.querySelector('#cancelNewTeamBtn').onclick =
      () => document.querySelector('#newTeamModal').close();
    document.querySelector('#newTeamForm').onsubmit = async event => {
      event.preventDefault();
      const title =
        document.querySelector('#newTeamName').value.trim() || 'Untitled organization';
      const template = document.querySelector('#newTeamTemplate').value;
      document.querySelector('#newTeamModal').close();
      try {
        // One request either way: clone takes the title, so unlike a board
        // copy there is nothing to rename afterwards. Creating selects, so
        // you land in the new team rather than back where you started.
        const created = await api(
          template ? '/api/team/teams/clone' : '/api/team/teams/create',
          template ? {team_uuid: template, title} : {title},
        );
        if (created?.value) await selectTeam(created.value);
        else await load();
      } catch (error) { showToast(error.message, true); }
    };

    const renderOrganization = (organization) => {
      const tree = document.querySelector('#organizationTree');
      tree.replaceChildren();
      const renderNode = (item, depth = 0) => {
        const branch = document.createElement('div');
        branch.className = 'organization-branch';
        branch.style.setProperty('--depth', depth);
        const row = document.createElement('div');
        row.className = 'organization-row';
        row.classList.toggle('is-current', item.uuid === current?.uuid);
        row.classList.toggle('is-restricted', !item.joined);
        row.classList.toggle(
          'is-readonly', item.joined && !item.interaction_allowed,
        );

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'organization-name';
        button.textContent = item.title;
        button.disabled = !item.joined;
        button.title = item.joined
          ? (
            item.interaction_allowed
              ? `Open ${item.title}`
              : `Open ${item.title} read-only`
          )
          : 'This subteam has separate membership';
        if (item.joined) button.onclick = () => selectTeam(item.uuid);

        const count = document.createElement('span');
        count.className = 'member-count';
        count.textContent = item.joined
          ? `${(item.members || []).length} ${(item.members || []).length === 1 ? 'person' : 'people'}`
          : 'Not joined';
        row.append(button, count);
        // A team nobody is in reads as a tree row like any other, and
        // would otherwise be indistinguishable from one people rely on. Only
        // that case is marked here: one actor is the ordinary state of
        // anything you have just made, so badging it in a tree of your own
        // teams marks every row and distinguishes nothing. It stays on
        // the team's own page, where it is about that team.
        if (item.state === 'template') {
          const state = document.createElement('span');
          state.className = 'state-badge';
          state.dataset.state = item.state;
          state.textContent = TEMPLATE_BADGE.label;
          state.title = TEMPLATE_BADGE.title;
          row.append(state);
        }
        // The tree is drawn through home, so any other seat this team
        // holds would otherwise be invisible - and an unseen second parent
        // is a trap for whoever deletes the first.
        if ((item.other_parents || []).length) {
          const also = document.createElement('span');
          also.className = 'other-parents';
          also.textContent = 'also in: '
            + item.other_parents.map(other => other.title).join(', ');
          row.append(also);
        }
        if (item.relationship_status === 'awaiting_parent_team') {
          const pending = document.createElement('span');
          pending.className = 'relationship-pending';
          pending.textContent = 'Parent link pending';
          row.append(pending);
        }
        branch.append(row);
        for (const child of item.children || []) {
          branch.append(renderNode(child, depth + 1));
        }
        return branch;
      };
      for (const root of organization?.roots || []) {
        tree.append(renderNode(root));
      }
      if (!tree.children.length) {
        const empty = document.createElement('p');
        empty.className = 'organization-empty';
        empty.textContent = 'No organizations yet';
        tree.append(empty);
      }

      // Archives are this client's own files. They sit under the tree
      // because that is the list they left, and nowhere else because
      // nobody else can see them.
      const archives = payloadState.archives || [];
      if (archives.length) {
        const shelf = document.createElement('details');
        shelf.className = 'archive-shelf';
        const summary = document.createElement('summary');
        summary.textContent = `Archived (${archives.length})`;
        shelf.append(summary);
        for (const item of archives) {
          const row = document.createElement('div');
          row.className = 'archive-row';
          const label = document.createElement('span');
          label.textContent = item.title;
          label.title = item.archived_at
            ? `Archived ${new Date(item.archived_at).toLocaleString()}`
            : item.file;
          row.append(label);
          const restore = document.createElement('button');
          restore.type = 'button';
          restore.textContent = 'Restore';
          restore.disabled = !item.restorable;
          restore.title = item.restorable
            ? 'Bring it back, as a private topic'
            : 'That team is already here';
          restore.onclick = async () => {
            restore.disabled = true;
            try {
              await api('/api/team/teams/restore', {file: item.file});
              await load();
              showToast(`${item.title} is back, and is private`);
            } catch (error) {
              restore.disabled = false;
              showToast(error.message, true);
            }
          };
          row.append(restore);
          shelf.append(row);
        }
        tree.append(shelf);
      }
    };

    // Who is here, and what they hold. My own line comes first and is the
    // only one that acts: a badge is taken or stepped out of by clicking it.
    // Everybody else's badges are a statement of where they stand, not a
    // control over them.
    // A picture where there is one, an initial for a person without, the
    // group mark for a team. Shared, so an actor looks the same wherever it
    // is drawn.
    //
    // An actor is an Individual or a Team. "Team" is what the document
    // is, and using the same word for the body that holds a role made a
    // role-holder list read as a list of documents. The node type stays
    // `team` - it is the same node - but nothing calls an actor that.
    const avatarFor = (person) => {
      if (person.actor_kind === 'team') {
        return SovereignUI.entityBadge({
          kind: 'team', compact: true,
          className: 'acceptance-avatar', title: person.name || 'Team',
        });
      }
      return SovereignUI.avatar(person, {
        className: 'acceptance-avatar',
        self: Boolean(person.is_self),
      });
    };

    const renderParticipants = (participants, trusteeships, interactive) => {
      const section = document.createElement('div');
      section.className = 'acceptance-panel';

      // Trustee roles are derived from their append-only state chains.
      const badgesFor = (person) => {
        const badges = [];
        for (const trust of ['identity', 'trust']) {
          const state = trusteeships?.[trust] || {};
          if (['held', 'contested'].includes(state.state)
              && state.holder_actor_uuid === person.uuid) {
            badges.push({
              name: trust === 'identity' ? 'Identity' : 'Trust',
              status: 'accepted', trustee: trust,
            });
          }
        }
        return badges.concat(person.roles || []);
      };

      const badgeElement = (role, actionable) => {
        const chip = SovereignUI.entityBadge({
          kind: 'role', label: role.name, status: role.status,
          icon: role.trustee ? '🔑' : '◇', interactive: true,
          className: 'role-chip',
        });
        if (role.trustee) chip.dataset.trustee = role.trustee;
        const label = HOLDER_STATUS[role.status] || role.status;
        if (!actionable) {
          chip.disabled = true;
          chip.title = `${role.name} \u2014 ${label}`;
          return chip;
        }
        const held = role.status === 'accepted';
        // Identity is a role, so it is stepped out of the way every other
        // role is - from your own badge. Leaving it inert was the only
        // holding on the page with no way out of it, which made the person
        // who speaks for a team the one person who could not leave.
        if (role.trustee) {
          chip.title = `${role.name} \u2014 ${label}. Click to step out.`;
          chip.onclick = () => {
            document.querySelector('#confirmModalConfirmBtn').textContent =
              'Step out';
            confirmAction(
              `Step out of ${role.name}?`,
              'The trusteeship stays vacant until a valid decision is implemented.',
              async () => {
                try {
                  const context = await requestDecisionContext(
                    `Step out of ${role.name}`,
                  );
                  if (!context) return;
                  await api('/api/team/trusteeships/resign', {
                    team_uuid: current.uuid, trust: role.trustee,
                    ...context,
                  });
                  await load();
                  showToast(`You no longer hold ${role.name}`);
                } catch (error) { showToast(error.message, true); }
              },
            );
          };
          return chip;
        }
        chip.title = held
          ? `${role.name} \u2014 ${label}. Click to step out.`
          : `${role.name} \u2014 ${label}. Click to take it.`;
        chip.onclick = async () => {
          chip.disabled = true;
          try {
            await api(
              held ? '/api/team/roles/resign'
                   : '/api/team/roles/decide',
              held ? {role_uuid: role.uuid}
                   : {role_uuid: role.uuid, decision: 'accepted'},
            );
            await load();
          } catch (error) {
            chip.disabled = false;
            showToast(error.message, true);
          }
        };
        return chip;
      };

      const rowFor = (person, actionable) => {
        const row = document.createElement('div');
        row.className = 'participant';
        row.classList.toggle('is-self', Boolean(person.is_self));
        row.append(avatarFor(person));
        const body = document.createElement('span');
        body.className = 'acceptance-body';
        const name = document.createElement('strong');
        name.textContent = person.is_self ? 'You' : person.name;
        body.append(name);
        const chips = document.createElement('span');
        chips.className = 'participant-roles';
        const badges = badgesFor(person);
        for (const role of badges) chips.append(badgeElement(role, actionable));
        if (!badges.length) {
          const none = document.createElement('span');
          none.className = 'participant-observer';
          // A member who has taken no work is a member, not an observer.
          // Saying "holds no role here" of both collapsed being on the
          // team into having something to do on it.
          none.textContent = person.is_member
            ? 'on this team, holding no role yet'
            : 'not on this team';
          chips.append(none);
        }
        body.append(chips);
        row.append(body);
        return row;
      };

      // This team is an actor too, and the roles it holds elsewhere are
      // roles like any other - so they are badges on its own line, read and
      // acted on exactly as yours are. There is no separate idea of a seat:
      // "Operations in Cooperative" is one role, named by where it is.
      const ownRow = () => {
        const seats = payloadState.parents || [];
        const offers = payloadState.seat_offers || [];
        const row = document.createElement('div');
        row.className = 'participant is-team';
        row.append(avatarFor({actor_kind: 'team'}));
        const body = document.createElement('span');
        body.className = 'acceptance-body';
        const name = document.createElement('strong');
        name.textContent = 'This team';
        const chips = document.createElement('span');
        chips.className = 'participant-roles';
        // Whoever speaks for the team answers for it, so the badges act
        // only for them. For everybody else they state where it stands.
        const mine = interactive && payloadState.holds_identity;
        for (const [index, seat] of seats.entries()) {
          chips.append(seatChip(seat, index, seats.length, mine));
        }
        for (const offer of offers) chips.append(offerChip(offer, mine));
        if (!seats.length && !offers.length) {
          const none = document.createElement('span');
          none.className = 'participant-observer';
          none.textContent = 'holds no role elsewhere';
          chips.append(none);
        }
        body.append(name, chips);
        row.append(body);
        return row;
      };

      // Held. Clicking steps out of it, the way your own accepted badge does.
      const seatChip = (seat, index, total, mine) => {
        const badgeLabel = `${seat.role_name || 'Role'} in ${seat.title}`;
        const chip = SovereignUI.entityBadge({
          kind: 'role', label: badgeLabel,
          status: seat.live ? 'accepted' : 'outdated',
          interactive: true, className: 'role-chip',
        });
        // Home is where the organisation draws it, and home is the first
        // seat in order that works - so the order is the only control there
        // is, and it lives on the badges themselves.
        const place = seat.is_home
          ? 'drawn here'
          : (seat.live ? 'also held here' : 'not reachable from here');
        if (!mine) {
          chip.disabled = true;
          chip.title = `${badgeLabel} — ${place}`;
          return chip;
        }
        chip.title = `${badgeLabel} — ${place}. Click to step out.`;
        chip.onclick = async () => {
          chip.disabled = true;
          try {
            await api('/api/team/roles/unseat', {
              role_uuid: seat.role_uuid, team_uuid: current.uuid,
            });
            await load();
          } catch (error) {
            chip.disabled = false;
            showToast(error.message, true);
          }
        };
        if (index > 0 && total > 1) {
          const prefer = document.createElement('span');
          prefer.className = 'chip-action ui-entity-action';
          prefer.textContent = '↑';
          prefer.title = `Draw this team under ${seat.title}`;
          prefer.onclick = async event => {
            event.stopPropagation();
            try {
              await api('/api/team/parents/move',
                {holding_uuid: seat.holding_uuid, index: 0});
              await load();
            } catch (error) { showToast(error.message, true); }
          };
          chip.append(prefer);
        }
        return chip;
      };

      // Offered. Clicking takes it, the way your own pending badge does.
      const offerChip = (offer, mine) => {
        const badgeLabel = `${offer.role_name} in ${offer.title}`;
        const chip = SovereignUI.entityBadge({
          kind: 'role', label: badgeLabel,
          status: offer.answer === 'refused' ? 'refused' : 'pending',
          interactive: true, className: 'role-chip',
        });
        const label = offer.answer === 'refused'
          ? 'turned down' : 'offered, not yet taken';
        if (offer.circular) {
          chip.disabled = true;
          chip.dataset.status = 'expired';
          chip.title = `${badgeLabel} — ${offer.title} already sits`
            + ' below this team, so taking it would make the'
            + ' organisation circular.';
          return chip;
        }
        if (!mine) {
          chip.disabled = true;
          chip.title = `${badgeLabel} — ${label}`;
          return chip;
        }
        chip.title = `${badgeLabel} — ${label}. Click to take it.`;
        chip.onclick = async () => {
          chip.disabled = true;
          try {
            await api('/api/team/roles/seat', {
              role_uuid: offer.role_uuid, team_uuid: current.uuid,
            });
            await load();
            showToast(`Now holding ${offer.role_name} in ${offer.title}`);
          } catch (error) {
            chip.disabled = false;
            showToast(error.message, true);
          }
        };
        // Turning an invitation down is the only thing here that is not
        // simply taking or leaving a role, so it is the one extra mark.
        if (offer.answer !== 'refused') {
          const decline = document.createElement('span');
          decline.className = 'chip-action ui-entity-action';
          decline.textContent = '×';
          decline.title = `Decline ${offer.role_name} in ${offer.title}`;
          decline.onclick = async event => {
            event.stopPropagation();
            try {
              await api('/api/team/roles/decline_seat', {
                role_uuid: offer.role_uuid, team_uuid: current.uuid,
              });
              await load();
            } catch (error) { showToast(error.message, true); }
          };
          chip.append(decline);
        }
        return chip;
      };

      const people = participants || [];
      const me = people.find(person => person.is_self);
      const others = people.filter(person => !person.is_self);
      const own = ownRow();
      section.append(own);
      if (me) section.append(rowFor(me, interactive));
      for (const person of others) section.append(rowFor(person, false));
      return section;
    };

    const renderMembership = (membership, interactive) => {
      const panel = document.createElement('section');
      panel.className = 'membership-panel';
      const heading = document.createElement('div');
      heading.className = 'membership-heading';
      const title = document.createElement('h4');
      title.textContent = 'Membership';
      heading.append(title);
      if (payloadState.pool?.uuid) {
        const poolLink = document.createElement('button');
        poolLink.type = 'button';
        poolLink.textContent = 'Onboarding Pool';
        poolLink.onclick = () => openPool(payloadState.pool.uuid);
        heading.append(poolLink);
      }
      if (interactive && membership.can_resolve) {
        const open = document.createElement('button');
        open.type = 'button';
        open.textContent = 'Open applications';
        open.onclick = async () => {
          try {
            await api('/api/team/membership/open', {team_uuid: current.uuid});
            await load();
          } catch (error) { showToast(error.message, true); }
        };
        heading.append(open);
      }
      panel.append(heading);

      // Who is on the team. Being here is membership - not a role, and not
      // a badge among the roles - so it is stated in one place, and the two
      // acts that change it live on it: Identity ends one, and leaving is
      // your own.
      const roster = document.createElement('div');
      roster.className = 'membership-roster';
      for (const person of membership.members || []) {
        const row = document.createElement('div');
        row.className = 'membership-member';
        row.append(avatarFor(person));
        const name = document.createElement('strong');
        name.textContent = person.is_self ? 'You' : person.name;
        row.append(name);
        const actions = document.createElement('span');
        actions.className = 'membership-actions';
        if (interactive && person.can_leave) {
          const leave = document.createElement('button');
          leave.type = 'button';
          leave.textContent = 'Leave';
          leave.title = 'Stop being on this team. Nobody else decides it.';
          leave.onclick = () => {
            document.querySelector('#confirmModalConfirmBtn').textContent =
              'Leave';
            confirmAction(
              'Leave this team?',
              'Your roles here stop being held. Getting back on means being '
              + 'admitted again, which is Identity’s decision.',
              async () => {
                try {
                  await api('/api/team/membership/leave',
                    {team_uuid: current.uuid});
                  await load();
                  showToast('You have left this team');
                } catch (error) { showToast(error.message, true); }
              },
            );
          };
          actions.append(leave);
        }
        if (interactive && person.can_remove) {
          const end = document.createElement('button');
          end.type = 'button';
          end.textContent = 'End membership';
          end.title = `Take ${person.name} off this team, for the team`;
          end.onclick = () => {
            document.querySelector('#confirmModalConfirmBtn').textContent =
              'End membership';
            confirmAction(
              `End ${person.name}’s membership?`,
              'Their roles here stop being held. Their own records are '
              + 'theirs and stay.',
              async () => {
                try {
                  const context = await requestDecisionContext(
                    `End ${person.name}’s membership`,
                  );
                  if (!context) return;
                  await api('/api/team/membership/end', {
                    team_uuid: current.uuid,
                    actor_uuid: person.uuid,
                    ...context,
                  });
                  await load();
                } catch (error) { showToast(error.message, true); }
              },
            );
          };
          actions.append(end);
        }
        row.append(actions);
        roster.append(row);
      }
      if (!(membership.members || []).length) {
        const none = document.createElement('p');
        none.className = 'membership-empty';
        none.textContent = 'Nobody is on this team.';
        roster.append(none);
      }
      panel.append(roster);

      const openings = membership.openings || [];
      if (!openings.length) {
        const empty = document.createElement('p');
        empty.className = 'membership-empty';
        empty.textContent = 'No application round has been opened.';
        panel.append(empty);
        return panel;
      }
      for (const opening of openings) {
        const card = document.createElement('article');
        card.className = 'membership-opening';
        const head = document.createElement('div');
        head.className = 'membership-opening-head';
        const label = document.createElement('strong');
        label.textContent = opening.state === 'open'
          ? 'Applications open'
          : (opening.state === 'contested' ? 'Opening conflicted' : 'Applications closed');
        head.append(label);
        if (interactive && membership.can_resolve && opening.state === 'open') {
          const close = document.createElement('button');
          close.type = 'button';
          close.textContent = 'Close';
          close.onclick = async () => {
            try {
              await api('/api/team/membership/close', {
                team_uuid: current.uuid, opening_uuid: opening.uuid,
              });
              await load();
            } catch (error) { showToast(error.message, true); }
          };
          head.append(close);
        }
        card.append(head);

        let selfApplied = false;
        for (const application of opening.applications || []) {
          if (application.actor.is_self) selfApplied = true;
          const row = document.createElement('div');
          row.className = 'membership-application';
          row.append(avatarFor(application.actor));
          const name = document.createElement('strong');
          name.textContent = application.actor.is_self ? 'You' : application.actor.name;
          const state = document.createElement('span');
          state.className = 'membership-state';
          state.textContent = application.resolution.state === 'pending'
            ? application.state
            : application.resolution.state;
          row.append(name, state);
          const actions = document.createElement('span');
          actions.className = 'membership-actions';
          const pending = application.state === 'submitted'
            && application.resolution.state === 'pending';
          if (interactive && pending && application.actor.is_self) {
            const withdraw = document.createElement('button');
            withdraw.type = 'button';
            withdraw.textContent = 'Withdraw';
            withdraw.onclick = async () => {
              try {
                await api('/api/team/membership/withdraw', {
                  team_uuid: current.uuid, application_uuid: application.uuid,
                });
                await load();
              } catch (error) { showToast(error.message, true); }
            };
            actions.append(withdraw);
          }
          if (interactive && pending && membership.can_resolve) {
            for (const [outcome, text] of [['accepted', 'Accept'], ['rejected', 'Reject']]) {
              const decide = document.createElement('button');
              decide.type = 'button';
              decide.textContent = text;
              decide.onclick = async () => {
                try {
                  const context = await requestDecisionContext(
                    `${text} membership application`,
                  );
                  if (!context) return;
                  await api('/api/team/membership/resolve', {
                    team_uuid: current.uuid,
                    application_uuid: application.uuid,
                    outcome,
                    ...context,
                  });
                  await load();
                } catch (error) { showToast(error.message, true); }
              };
              actions.append(decide);
            }
          }
          row.append(actions);
          card.append(row);
        }
        if (interactive && opening.state === 'open'
            && !membership.is_member && !selfApplied) {
          const apply = document.createElement('button');
          apply.type = 'button';
          apply.className = 'membership-apply';
          apply.textContent = 'Apply to join';
          apply.onclick = async () => {
            try {
              await api('/api/team/membership/apply', {
                team_uuid: current.uuid, opening_uuid: opening.uuid,
              });
              await load();
            } catch (error) { showToast(error.message, true); }
          };
          card.append(apply);
        }
        panel.append(card);
      }
      return panel;
    };

    const renderTrusteeElections = (elections, membership, interactive) => {
      const panel = document.createElement('section');
      panel.className = 'elections-panel';
      const heading = document.createElement('div');
      heading.className = 'elections-heading';
      const title = document.createElement('h4');
      title.textContent = 'Trustee decisions';
      heading.append(title);
      if (interactive && membership.is_member) {
        const actions = document.createElement('span');
        actions.className = 'election-start-actions';
        for (const trust of ['identity', 'trust']) {
          const startGroup = document.createElement('span');
          startGroup.className = 'election-start-group';
          const facilitatorTrust = trust === 'identity' ? 'trust' : 'identity';
          const facilitatorLabel =
            facilitatorTrust === 'identity' ? 'Identity' : 'Trust';
          const facilitator = payloadState[facilitatorTrust] || {};
          const acting = facilitator.state === 'vacant'
            ? (facilitator.candidates || []) : [];
          // An election is facilitated by the counterpart trusteeship, so a
          // vacancy there has to be answered before one can be started. A
          // picker is only a choice when there is something to choose:
          // with nobody acting it used to render as an empty control that
          // said nothing and did nothing.
          let facilitatorPicker = null;
          if (acting.length) {
            facilitatorPicker = document.createElement('select');
            facilitatorPicker.title = `Acting ${facilitatorLabel} facilitator`;
            for (const candidate of acting) {
              const option = document.createElement('option');
              option.value = candidate.actor_uuid;
              option.textContent = candidate.is_self ? 'You facilitate' : `${candidate.name} facilitates`;
              facilitatorPicker.append(option);
            }
            startGroup.append(facilitatorPicker);
          }
          const blocked = facilitator.state === 'vacant' && !acting.length;
          const start = document.createElement('button');
          start.type = 'button';
          start.textContent = `Elect ${trust === 'identity' ? 'Identity' : 'Trust'}`;
          start.disabled = blocked;
          if (blocked) {
            start.title = `${facilitatorLabel} is vacant and nobody is`
              + ` acting in it, so there is no one to facilitate this`
              + ` election. Someone has to act for ${facilitatorLabel} first.`;
          }
          start.onclick = async () => {
            try {
              await api('/api/team/elections/start', {
                team_uuid: current.uuid, trust,
                facilitator_actor_uuid: facilitatorPicker?.value || '',
              });
              await load();
              showToast(`${start.textContent} started`);
            } catch (error) { showToast(error.message, true); }
          };
          startGroup.append(start);
          actions.append(startGroup);
        }
        heading.append(actions);
      }
      panel.append(heading);
      if (!(elections || []).length) {
        const empty = document.createElement('p');
        empty.className = 'elections-empty';
        empty.textContent = 'No trustee election has been started.';
        panel.append(empty);
        return panel;
      }
      for (const election of elections) {
        const card = document.createElement('article');
        card.className = 'election-card';
        const head = document.createElement('div');
        head.className = 'election-card-head';
        const name = document.createElement('strong');
        name.textContent = `${election.trust === 'identity' ? 'Identity' : 'Trust'} election`;
        const state = document.createElement('span');
        state.className = 'election-state';
        state.textContent = election.implemented
          ? 'Implemented'
          : (election.outcome || election.lifecycle || 'Unavailable');
        head.append(name, state);
        card.append(head);
        const detail = document.createElement('p');
        detail.className = 'election-detail';
        if (election.outcome === 'elected') {
          detail.textContent = election.selected_candidate_name
            ? `Selected ${election.selected_candidate_name}`
            : 'A candidate has been selected.';
        } else if (election.outcome === 'void') {
          detail.textContent = 'The election ended without a selection.';
        } else if (election.lifecycle === 'unavailable') {
          detail.textContent = 'Join the linked S-Flow process to see its progress.';
        } else {
          detail.textContent = election.current_stage
            ? `Current step: ${election.current_stage}`
            : `S-Flow is ${election.lifecycle}.`;
        }
        card.append(detail);

        // Who votes. The electorate is every current Member at the moment
        // the election was started, and it is fixed there - a page that
        // does not say so leaves people guessing whether they are in it.
        const voters = (election.electorate_actor_uuids || [])
          .map(uuid => userForParticipant(uuid))
          .map(person => (
            person.uuid === payloadState.identity_uuid ? 'You' : person.name
          ));
        if (voters.length) {
          const electorate = document.createElement('p');
          electorate.className = 'election-electorate';
          electorate.textContent =
            `${voters.length} ${voters.length === 1 ? 'voter' : 'voters'}: `
            + voters.join(', ');
          card.append(electorate);
        }

        // The process is a place you go, not an identifier you read. It
        // used to be printed as a bare uuid, which is unreadable and
        // unclickable both.
        if (election.lifecycle === 'unavailable') {
          const away = document.createElement('p');
          away.className = 'election-process';
          away.textContent = election.can_join
            ? 'The team put this election on its own channel. It is not here yet.'
            : 'This election has not been shared with you.';
          card.append(away);
          // An elector may ask for it. Asking is this client's own consent
          // to receive it - Core never grafts a topic into a tree because
          // it happens to share a channel with one already there.
          if (interactive && election.can_join) {
            const join = document.createElement('button');
            join.type = 'button';
            join.className = 'election-implement';
            join.textContent = 'Bring it here';
            join.onclick = async () => {
              join.disabled = true;
              try {
                await api('/api/team/elections/join', {
                  team_uuid: current.uuid, election_uuid: election.uuid,
                });
                await load();
                showToast('Joining the election; it will arrive on the next sync');
              } catch (error) {
                join.disabled = false;
                showToast(error.message, true);
              }
            };
            card.append(join);
          }
        } else {
          const open = document.createElement('a');
          open.className = 'election-process';
          open.href = `/apps/flow?process_uuid=${encodeURIComponent(election.process_uuid)}`;
          open.textContent = election.outcome
            ? 'Open the result in S-Flow'
            : 'Take part in S-Flow';
          open.title = `S-Flow process ${election.process_uuid}`;
          card.append(open);
        }
        if (interactive && election.can_implement) {
          const implement = document.createElement('button');
          implement.type = 'button';
          implement.className = 'election-implement';
          implement.textContent = 'Implement decision';
          implement.onclick = async () => {
            try {
              const context = await requestDecisionContext(
                `Implement ${election.trust === 'identity' ? 'Identity' : 'Trust'} decision`,
              );
              if (!context) return;
              await api('/api/team/elections/implement', {
                team_uuid: current.uuid, election_uuid: election.uuid,
                ...context,
              });
              await load();
              showToast('Trusteeship updated');
            } catch (error) { showToast(error.message, true); }
          };
          card.append(implement);
        }
        panel.append(card);
      }
      return panel;
    };

    // When it happened, who did it, what they were doing, and how it came
    // out. Everything that has been decided here is one row, in one order,
    // because that is what a trail is - the panel used to show only the
    // trustee actions somebody had typed in by hand, so stepping out of a
    // trusteeship asked for its signals and then recorded them nowhere.
    const renderDecisionTrail = (trail, interactive) => {
      const panel = document.createElement('section');
      panel.className = 'trustee-actions-panel';
      const title = document.createElement('h4');
      title.textContent = 'Decision trail';
      panel.append(title);

      if (interactive) {
        for (const trust of ['identity', 'trust']) {
          const trusteeship = payloadState[trust] || {};
          if (!trusteeship.can_act) continue;
          const form = document.createElement('form');
          form.className = 'trustee-action-form';
          const heading = document.createElement('strong');
          heading.textContent = `Record ${trust === 'identity' ? 'Identity' : 'Trust'} action`;
          const subject = document.createElement('input');
          subject.required = true;
          subject.placeholder = 'Subject or reference';
          const decision = document.createElement('textarea');
          decision.required = true;
          decision.rows = 2;
          decision.placeholder = 'Decision or action';
          const signals = document.createElement('textarea');
          signals.rows = 2;
          signals.placeholder = 'Signals (optional, missing will be marked)';
          const consideration = document.createElement('textarea');
          consideration.rows = 2;
          consideration.placeholder = 'Consideration';
          const expectation = document.createElement('textarea');
          expectation.rows = 2;
          expectation.placeholder = 'Expectation';
          const submit = document.createElement('button');
          submit.type = 'submit';
          submit.textContent = 'Record action';
          form.append(
            heading, subject, decision, signals, consideration, expectation,
            submit,
          );
          form.onsubmit = async event => {
            event.preventDefault();
            try {
              await api('/api/team/trusteeships/actions/record', {
                team_uuid: current.uuid,
                trust,
                subject_uuid: subject.value.trim(),
                payload: {decision: decision.value.trim()},
                signals: signals.value.trim(),
                consideration: consideration.value.trim(),
                expectation: expectation.value.trim(),
              });
              await load();
            } catch (error) { showToast(error.message, true); }
          };
          panel.append(form);
        }
      }

      if (!(trail || []).length) {
        const empty = document.createElement('p');
        empty.className = 'trustee-actions-empty';
        empty.textContent = 'Nothing has been decided here yet.';
        panel.append(empty);
        return panel;
      }

      const history = document.createElement('ol');
      history.className = 'decision-trail';
      for (const record of trail) {
        const item = document.createElement('li');
        item.className = 'decision-record';
        item.dataset.kind = record.kind || '';
        item.classList.toggle('is-contested', Boolean(record.contested));

        const when = document.createElement('time');
        when.className = 'decision-when';
        // A record written before its own timestamp existed still has the
        // node's creation time; an unparseable one says so rather than
        // printing "Invalid Date".
        const at = record.at ? new Date(record.at) : null;
        when.textContent = at && !Number.isNaN(at.valueOf())
          ? at.toLocaleString()
          : 'undated';
        if (record.at) when.dateTime = record.at;

        const who = document.createElement('span');
        who.className = 'decision-who';
        who.textContent = record.actor_is_self ? 'You' : record.actor_name;

        const what = document.createElement('span');
        what.className = 'decision-intent';
        what.textContent = record.intent;

        const outcome = document.createElement('span');
        outcome.className = 'decision-result';
        outcome.textContent = record.contested
          ? `${record.result} · conflicting records`
          : record.result;

        item.append(when, who, what, outcome);

        // The context is the reasoning behind the row, and most rows are
        // read without it, so it opens rather than takes four lines each.
        const context = [
          ['Signals', record.signals, record.signals_missing],
          ['Consideration', record.consideration, false],
          ['Expectation', record.expectation, false],
        ].filter(([, value, missing]) => value || missing);
        const observations = record.realities || [];
        const canObserve = interactive && record.can_observe;
        if (context.length || observations.length || canObserve) {
          const more = document.createElement('details');
          more.className = 'decision-context';
          const summary = document.createElement('summary');
          summary.textContent = observations.length
            ? `Context and reality (${observations.length})`
            : 'Context';
          more.append(summary);
          const list = document.createElement('dl');
          for (const [name, value, missing] of context) {
            const term = document.createElement('dt');
            term.textContent = name;
            const detail = document.createElement('dd');
            detail.textContent = value || 'Missing';
            detail.classList.toggle('is-missing', Boolean(missing));
            list.append(term, detail);
          }
          if (list.childElementCount) more.append(list);
          for (const observation of observations) {
            const reality = document.createElement('blockquote');
            reality.className = 'trustee-reality';
            reality.textContent =
              `Reality: ${observation.reality} — ${observation.observer_name}`;
            more.append(reality);
          }
          if (canObserve) {
            const realityForm = document.createElement('form');
            realityForm.className = 'trustee-reality-form';
            const input = document.createElement('input');
            input.required = true;
            input.placeholder = 'What actually happened?';
            const submit = document.createElement('button');
            submit.type = 'submit';
            submit.textContent = 'Add Reality';
            realityForm.append(input, submit);
            realityForm.onsubmit = async event => {
              event.preventDefault();
              try {
                await api('/api/team/trusteeships/actions/reality', {
                  team_uuid: current.uuid,
                  action_uuid: record.uuid,
                  reality: input.value.trim(),
                });
                await load();
              } catch (error) { showToast(error.message, true); }
            };
            more.append(realityForm);
          }
          item.append(more);
        }
        history.append(item);
      }
      panel.append(history);
      return panel;
    };

    const findDisplayedNode = (uuid) => {
      const roots = [
        current,
        ...(payloadState.proposed_nodes || []).map(entry => entry.node),
      ].filter(Boolean);
      const pending = [...roots];
      const seen = new Set();
      while (pending.length) {
        const node = pending.pop();
        if (!node || seen.has(node.uuid)) continue;
        if (node.uuid === uuid) return node;
        seen.add(node.uuid);
        pending.push(...(node.children || []));
      }
      return null;
    };

    // UI state that holds no focus, so the edit guard in render() cannot
    // protect it and a rebuild would close it. Kept here rather than in the
    // DOM so a full re-render restores it instead of destroying it.
    const ephemeral = {openMenu: '', disclosures: null};

    // Identity gets a compact warning line only when it needs attention.
    const renderIdentity = (identity, interactive) => {
      const line = document.createElement('div');
      line.className = 'identity-line';
      const state = identity.state || 'unconfigured';
      line.dataset.state = state;

      const mark = document.createElement('span');
      mark.className = 'identity-mark';
      mark.textContent = ['held', 'contested'].includes(state) ? '\u{1F511}' : '⚠';

      const text = document.createElement('span');
      text.className = 'identity-text';
      if (state === 'unconfigured') {
        text.textContent = 'Template: instantiate Member, Identity, and Trust';
      } else if (state === 'vacant') {
        text.textContent = 'Identity is vacant; a decision is required';
      } else if (state === 'contested') {
        text.textContent = `Identity is contested; ${identity.holder_name} remains incumbent`;
      } else {
        text.textContent = `Identity: ${identity.holder_name}`;
      }

      const actions = document.createElement('span');
      actions.className = 'identity-actions';
      if (interactive && state === 'unconfigured') {
        const instantiate = document.createElement('button');
        instantiate.type = 'button';
        instantiate.textContent = 'Instantiate';
        instantiate.onclick = async () => {
          try {
            await api('/api/team/identity/take', {team_uuid: current.uuid});
            await load();
            showToast('Organization instantiated');
          } catch (error) { showToast(error.message, true); }
        };
        actions.append(instantiate);
      }

      line.append(mark, text, actions);
      return line;
    };

    // "Unobserved" is deliberately not worded as "pending": one means they
    // have not answered, the other that this session cannot see whether they
    // have. Collapsing them would be a lie the interface tells.
    const HOLDER_STATUS = {
      accepted: 'holds this',
      pending: 'invited, not yet taken up',
      refused: 'turned it down',
      expired: 'lapsed',
      outdated: 'took an earlier version',
      uninvited: 'not on this team',
      unobserved: 'answer not visible from here',
    };

    // A team nobody is in is worth marking in the tree, where it sits
    // among teams people rely on. On its own page it needs no line: the
    // Identity line already says nobody holds it and every role already says
    // nobody is invited, so a third statement of the same fact is repetition.
    // Working and instantiated are marked nowhere - they are the ordinary
    // states of anything you have made.
    const TEMPLATE_BADGE = {
      label: 'Template',
      title: 'Nobody holds a role here.',
    };

    // Accountabilities and domains differ only in what they are called, so
    // one card renders both columns from this table.
    const ROLE_ITEM_KINDS = [
      {
        kind: 'accountability', type: 'team_accountability',
        label: 'Accountabilities', add: 'New accountability',
      },
      {
        kind: 'domain', type: 'team_domain',
        label: 'Domains', add: 'New domain',
      },
    ];

    const renderRoleCard = ({role, proposed, index, count, interactive,
                             reactable, movable}) => {
      const card = document.createElement('article');
      card.className = 'role-card';
      card.classList.toggle('is-proposed', proposed);

      card.append(elementRow({
        node: role,
        tag: 'h4',
        field: 'name',
        rename: value => api('/api/team/roles/rename',
          {role_uuid: role.uuid, name: value}),
        proposed,
        interactive,
        reactable,
        index,
        count,
        onMove: movable ? async newIndex => {
          try {
            await api('/api/team/roles/move',
              {role_uuid: role.uuid, index: newIndex});
            await load();
          } catch (error) { showToast(error.message, true); }
        } : null,
        onDelete: interactive ? async () => {
          try {
            await api('/api/team/roles/delete', {role_uuid: role.uuid});
            await load();
          } catch (error) { showToast(error.message, true); }
        } : null,
        deleteTitle: 'Delete this role?',
        deleteMessage:
          'Its accountabilities and domains go with it. This cannot be undone.',
      }));

      // An unset purpose is a genuinely empty element - the prompt is a CSS
      // pseudo-element, so it can never be committed as the value.
      const purpose = document.createElement('p');
      purpose.className = 'role-purpose';
      purpose.textContent = role.data.purpose || '';
      if (interactive) {
        editable(purpose, role.data.purpose || '', value =>
          api('/api/team/roles/set_purpose',
            {role_uuid: role.uuid, purpose: value}));
      }
      card.append(purpose);

      const columns = document.createElement('div');
      columns.className = 'role-columns';
      for (const {kind, type, label, add} of ROLE_ITEM_KINDS) {
        const column = document.createElement('div');
        column.className = 'role-column';
        const columnTitle = document.createElement('h5');
        columnTitle.textContent = label;
        column.append(columnTitle);
        const items = displayedChildren(role, type, proposed);
        const itemsHaveProposals = items.some(entry => entry.proposed);
        items.forEach(({
          node: item, proposed: itemProposed, inherited: itemInherited,
        }, itemIndex) => {
          column.append(elementRow({
            node: item,
            tag: 'p',
            field: 'text',
            rename: value => api('/api/team/roles/items/update',
              {item_uuid: item.uuid, text: value}),
            proposed: itemProposed,
            interactive: interactive && !itemProposed,
            reactable: reactable && !itemInherited,
            index: itemIndex,
            count: items.length,
            onMove: (!interactive || itemProposed || itemsHaveProposals)
              ? null
              : async newIndex => {
                try {
                  await api('/api/team/roles/items/move',
                    {item_uuid: item.uuid, index: newIndex});
                  await load();
                } catch (error) { showToast(error.message, true); }
              },
            onDelete: interactive && !itemProposed ? async () => {
              try {
                await api('/api/team/roles/items/delete',
                  {item_uuid: item.uuid});
                await load();
              } catch (error) { showToast(error.message, true); }
            } : null,
            deleteTitle: `Delete this ${kind}?`,
            deleteMessage: 'This cannot be undone.',
          }));
        });
        if (interactive) {
          column.append(SovereignUI.addComposer({
            noun: kind,
            placeholder: add,
            onSubmit: async text => {
              await api('/api/team/roles/items/create',
                {role_uuid: role.uuid, kind, text});
              await load();
            },
            onError: error => showToast(error.message, true),
          }));
        }
        columns.append(column);
      }
      card.append(columns);

      // Who has been invited, and where each of them stands. Taking a role
      // or stepping out of one happens on your own line in Participants -
      // this is the definition, not the doing. Inviting somebody is any
      // member's, and withdrawing an invitation is whoever wrote it.
      const holders = (payloadState.role_holders || {})[role.uuid] || [];
      const held = document.createElement('div');
      held.className = 'role-holders';
      const heldHeading = document.createElement('div');
      heldHeading.className = 'role-holders-heading';
      const heldTitle = document.createElement('h5');
      heldTitle.textContent = 'Held by';
      heldHeading.append(heldTitle);
      held.append(heldHeading);
      if (!holders.length) {
        const none = document.createElement('p');
        none.className = 'role-unheld';
        none.textContent = 'Nobody invited yet';
        held.append(none);
      }
      // A line of faces and names, and nothing else on the page. Who holds a
      // role is a glance; when they answered, against which version, and who
      // offered it are questions you only ask about one of them, so they
      // live in the tooltip rather than in six columns of small type.
      const badges = document.createElement('div');
      badges.className = 'holder-badges';
      for (const holder of holders) {
        const kind = holder.actor_kind === 'team' ? 'team' : 'person';
        const badge = SovereignUI.entityBadge({
          kind,
          person: holder,
          label: holder.is_self ? 'You' : holder.name,
          status: holder.status,
          self: Boolean(holder.is_self),
          className: 'holder-badge',
        });
        badge.dataset.actorKind = holder.actor_kind;
        if (holder.outside_parent) badge.dataset.outsideParent = 'true';
        badge.querySelector('.ui-entity-label').classList.add('holder-name');

        const detail = [HOLDER_STATUS[holder.status] || holder.status];
        if (holder.status === 'unobserved') {
          detail.push(
            'You do not sync with them, so you cannot see their answer.',
          );
        }
        if (holder.actor_kind === 'team' && !holder.joined) {
          detail.push(
            'Invited separately; you have not joined that team.',
          );
        }
        // The offer for this one is still only on the author's replica, so
        // it is worth saying where it stands - answering it takes it up.
        if (holder.offered_elsewhere) {
          detail.push('Offered to you; answering it accepts the offer');
        }
        // Being on a team below is being on the team above, so their answer
        // here is not the whole of where they stand.
        if (holder.outside_parent) {
          detail.push('Holds no role on a team above, so is out of this one');
        }
        if (holder.offered_at) {
          detail.push(
            `Offered ${new Date(holder.offered_at).toLocaleString()}`,
          );
        }
        if (holder.decided_at) {
          detail.push(
            `Answered ${new Date(holder.decided_at).toLocaleString()}`,
          );
        }
        if (holder.expires_at) {
          detail.push(
            `Until ${new Date(holder.expires_at).toLocaleString()}`,
          );
        }
        badge.title = `${holder.is_self ? 'You' : holder.name} — `
          + detail.map(part => part.replace(/\.$/, '')).join('. ');

        // A seat filled by another team opens it. Structure is made by
        // filling a role, so this is where the organisation is walked.
        if (holder.actor_kind === 'team' && holder.joined) {
          badge.classList.add('team-link');
          badge.tabIndex = 0;
          const open = () => selectTeam(holder.actor_uuid);
          badge.onclick = open;
          badge.onkeydown = event => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              open();
            }
          };
          badge.title += `. Click to open ${holder.name}`;
        }

        // Withdrawing an invitation is whoever wrote it taking their own
        // suggestion back. It no longer takes the role away - the member's
        // own answer is what holds it - so this only appears while the
        // invitation is still what is standing.
        const wroteIt = interactive && holder.offered_by === payloadState.identity_uuid;
        if (wroteIt && !holder.is_self && holder.status === 'pending') {
          const revoke = document.createElement('button');
          revoke.type = 'button';
          revoke.className = 'holder-action ui-entity-action';
          revoke.textContent = '×';
          revoke.title = `Withdraw your invitation of ${holder.name}`;
          revoke.onclick = event => {
            event.stopPropagation();
            document.querySelector('#confirmModalConfirmBtn').textContent =
              'Withdraw';
            confirmAction(
              `Withdraw the invitation of ${holder.name}?`,
              'This takes back the suggestion. If they have already taken '
              + 'the role, it stays theirs - stepping out of it is theirs.',
              async () => {
                try {
                  await api('/api/team/roles/revoke',
                    {role_uuid: role.uuid, actor_uuid: holder.actor_uuid});
                  await load();
                } catch (error) { showToast(error.message, true); }
              },
            );
          };
          badge.append(revoke);
        }
        badges.append(badge);
      }
      if (holders.length) held.append(badges);

      // Any member may invite somebody into a role: suggesting work is not
      // an exercise of authority. Seating a *team* is, because it admits
      // everybody on it, so that stays the Identity holder's.
      if (interactive && payloadState.membership?.is_member) {
        // A withdrawn invitation is re-offerable - offer_role revives the
        // same record - so only a standing one takes somebody out of
        // the list.
        const spoken = new Set(
          holders.map(holder => holder.actor_uuid),
        );
        const candidates = (payloadState.offerable_actors || [])
          .filter(actor => !spoken.has(actor.uuid))
          // Seating a team admits everybody on it, so only the Identity
          // holder may offer one. Listing them to somebody who cannot
          // would be offering a choice that always fails - and a picker
          // with nothing left in it is not a picker at all.
          .filter(actor => (
            actor.kind !== 'team' || payloadState.holds_identity
          ));
        if (candidates.length) {
          const picker = document.createElement('select');
          picker.className = 'role-offer-picker';
          const blank = document.createElement('option');
          blank.value = '';
          blank.textContent = 'Offer to\u2026';
          picker.append(blank);
          const groups = {
            individual: document.createElement('optgroup'),
            team: document.createElement('optgroup'),
          };
          groups.individual.label = 'Individuals';
          groups.team.label = 'Teams';
          for (const actor of candidates) {
            const option = document.createElement('option');
            option.value = actor.uuid;
            // A profile with no display name falls back to an address, which
            // is a poor way to be told about yourself.
            option.textContent = actor.uuid === payloadState.identity_uuid
              ? 'You'
              : actor.name;
            groups[actor.kind === 'team' ? 'team' : 'individual']
              .append(option);
          }
          for (const group of Object.values(groups)) {
            if (group.childElementCount) picker.append(group);
          }
          picker.onchange = async () => {
            if (!picker.value) return;
            const chosen = picker.value;
            picker.value = '';
            // The picker is a <select> inside #document, and the guard in
            // render() skips the rebuild while anything of that shape has
            // focus - so choosing somebody left the offer invisible until
            // the reader happened to click elsewhere. Nothing is being
            // typed here: the choice is already made.
            picker.blur();
            try {
              await api('/api/team/roles/offer',
                {role_uuid: role.uuid, actor_uuid: chosen});
              await load();
            } catch (error) { showToast(error.message, true); }
          };
          heldHeading.append(picker);
        }
      }

      // Every role is open to every Member, and taking one needs nobody's
      // permission: Identity decides membership, not what a member does
      // once they are here. There is no round to open and nobody to
      // confirm it - the answer is the holding.
      const iAmSpokenFor = holders.some(holder => holder.is_self);
      if (interactive && !iAmSpokenFor && payloadState.membership?.is_member) {
        const take = document.createElement('button');
        take.type = 'button';
        take.className = 'role-apply';
        take.textContent = 'Take this role';
        take.title = `Take ${role.data.name}. It is yours to take.`;
        take.onclick = async () => {
          take.disabled = true;
          try {
            await api('/api/team/roles/decide',
              {role_uuid: role.uuid, decision: 'accepted'});
            await load();
            showToast(`You now hold ${role.data.name}`);
          } catch (error) {
            take.disabled = false;
            showToast(error.message, true);
          }
        };
        held.append(take);
      }
      card.append(held);
      return card;
    };

    // Identity is a role - singular, and shaped differently only for that
    // reason (§1.3) - so it is read where the roles are read rather than as
    // a line off to one side. It carries no accountabilities or domains
    // yet, and the card says so rather than drawing two empty columns.
    const renderTrusteeRoleCard = (trust, interactive) => {
      const label = trust === 'identity' ? 'Identity' : 'Trust';
      const trusteeship = payloadState[trust] || {state: 'unconfigured'};
      const card = document.createElement('article');
      card.className = 'role-card is-identity';
      card.append(elementRow({
        node: {uuid: trusteeship.node_uuid || '', data: {name: label}},
        tag: 'h4',
        field: 'name',
        // The word "Identity" is not editable - it is the role's name, not
        // its content - but a handover in flight is answered right here.
        interactive: false,
        reactable: interactive,
      }));

      const purpose = document.createElement('p');
      purpose.className = 'role-purpose';
      purpose.textContent = trust === 'identity'
        ? 'Control membership and represent the Team in its identity domain.'
        : 'Facilitate decisions about Identity and represent the Team in its trust domain.';
      card.append(purpose);
